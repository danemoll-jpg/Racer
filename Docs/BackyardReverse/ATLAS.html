<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dan’s Backyard route atlas</title><style>body{margin:0;background:#10262b;color:#e9f5f4;font:16px system-ui}header{padding:20px 28px;position:sticky;top:0;background:#10262bf0}h1{font-size:22px;margin:0 0 12px}button,a{font:inherit;color:inherit}button{border:1px solid #54716e;border-radius:7px;background:#234341;padding:10px 18px;cursor:pointer;margin-right:10px}button[aria-pressed=true]{background:#80e4cb;color:#10262b}img{display:block;width:100%;height:auto}p{margin:12px 0 0;color:#b6d1d4}</style><header><h1>Dan’s Backyard • route atlas</h1><button aria-pressed="false" onclick="select('Forward',this)">Approved Forward + shortcuts</button><button aria-pressed="true" onclick="select('Reverse',this)">Reverse main</button><a id="full" href="Reverse.png" target="_blank">Open full resolution</a><p>Actual saved geometry · north is +Z · coordinate grid in metres · separate views keep the routes readable.</p></header><img id="map" src="Reverse.png" alt="Backyard Reverse main route, jumps, checkpoints and permanent geography"><script>function select(direction,button){document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===button));document.getElementById('map').src=direction+'.png';document.getElementById('map').alt='Backyard '+direction+' actual route atlas';document.getElementById('full').href=direction+'.png'}</script></html>
